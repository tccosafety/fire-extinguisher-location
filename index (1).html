<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fire Extinguisher Location</title>
<style>
body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:20px}
h1{font-size:26px}
#gpsButton{width:100%;padding:18px;font-size:20px;font-weight:bold;border:0;border-radius:8px;cursor:pointer;margin:10px 0}
#gpsStatus,#diagnostics{padding:15px;margin:10px 0 20px;border-radius:8px;background:#f2f2f2;line-height:1.45}
#diagnostics{font-family:monospace;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Fire Extinguisher Location</h1>
<button id="gpsButton" type="button">Use My Current Location</button>
<div id="gpsStatus">Location not captured.</div>
<details>
<summary>Diagnostics</summary>
<div id="diagnostics">Ready.</div>
</details>

<div id="cognitoForm"></div>

<script src="https://www.cognitoforms.com/f/seamless.js"
        data-key="2ZgTWFZjNkGJ7F5lXdNAgw"
        data-form="27"></script>

<script>
(function(){
 const b=document.getElementById("gpsButton");
 const s=document.getElementById("gpsStatus");
 const d=document.getElementById("diagnostics");

 function log(x){d.textContent += "\n"+x;}

 b.addEventListener("click",function(){
   if(!navigator.geolocation){
     s.textContent="This browser does not support geolocation.";
     return;
   }
   b.disabled=true;
   b.textContent="Getting Location...";
   s.textContent="Requesting GPS location...";

   navigator.geolocation.getCurrentPosition(function(pos){
     const lat=Number(pos.coords.latitude.toFixed(6));
     const lon=Number(pos.coords.longitude.toFixed(6));
     const acc=Math.round(pos.coords.accuracy);

     s.innerHTML="<strong>GPS captured.</strong><br>"+lat+", "+lon+
       "<br>Reported accuracy: about "+acc+" meters.<br>Loading these coordinates into the form...";
     log("GPS: "+lat+", "+lon);
     log("Accuracy: "+acc+" m");

     try{
       const mounted=Cognito.mount("27","#cognitoForm");
       log("Cognito.mount succeeded.");
       mounted.prefill({Latitude:lat,Longitude:lon});
       log('Prefill sent: {"Latitude":'+lat+',"Longitude":'+lon+"}");
       s.innerHTML="<strong>Location captured and sent to Cognito.</strong><br>"+
         lat+", "+lon+"<br>Reported accuracy: about "+acc+" meters.";
       b.textContent="Location Captured";
     }catch(err){
       log("ERROR: "+(err && err.stack ? err.stack : err));
       s.textContent="GPS was captured, but Cognito returned an error. Open Diagnostics below and send me what it says.";
       b.disabled=false;
       b.textContent="Try Again";
     }
   },function(err){
     log("Geolocation error code: "+err.code+" / "+err.message);
     s.textContent=err.code===1
       ?"Location permission was denied. Allow location access and try again."
       :err.code===2
       ?"Your location could not be determined. Try again outdoors."
       :"The GPS request timed out. Try again.";
     b.disabled=false;
     b.textContent="Try Again";
   },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 });
})();
</script>
</body>
</html>
